[project]
name = "proviral_landscape_plot"
version = "0.0.0"
description = "The proviral landscape plot CLI for BBLab web-site"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0" }
dependencies = [
  "drawsvg==2.4.0",
  "genetracks @ git+https://github.com/cfe-lab/genetracks.git@a7f20f644ab86b451e870c9ace0621af8ecae0df",
]

[project.scripts]
proviral_landscape_plot = "proviral_landscape_plot:main"

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
]
dev = [
  "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

# The plotting code is a single module living next to the Django app files, so
# only that module is packaged. The other files in this directory (views.py,
# admin.py, templates, ...) belong to the web-site, not to the CLI.
[tool.hatch.build.targets.wheel]
only-include = ["proviral_landscape_plot.py"]

[tool.hatch.build.targets.sdist]
include = [
  "proviral_landscape_plot.py",
  "README.md",
  "pyproject.toml",
]

[tool.mypy]
mypy_path = ["../.."]

[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "genetracks"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "genetracks.elements"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "drawsvg"
ignore_missing_imports = true